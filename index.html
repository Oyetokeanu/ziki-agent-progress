<style>
:root{--bg:#f5f6fa;--cd:#fff;--tx:#12162a;--mu:#667085;--bd:#e3e6ee;--pr:#2f5bea;--gr:#0f9d77;--rd:#d92d20;--or:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:#f5f6fa;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}.chip{font-size:13px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 10px}
.top nav{display:flex;gap:4px}.top nav span{padding:5px 12px;border-radius:99px;color:var(--mu);font-size:14px}.top nav .on{background:#e9efff;color:var(--pr);font-weight:600}
.sp{flex:1}.pts{background:#fff4d6;color:#8a5a00;border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#12162a;color:#fff;font-weight:700;font-size:12px}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}.crumb{color:var(--mu);font-size:14px;margin-bottom:12px}.crumb b{color:var(--tx)}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}h2{font-size:17px;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.tabs{display:flex;gap:6px;margin-top:16px;background:#eceff5;border-radius:12px;padding:4px;width:fit-content;max-width:100%}.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;color:var(--mu)}.tabs button[aria-pressed=true]{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.l{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff}textarea{resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 13px}.chips button[aria-pressed=true]{background:#e9efff;border-color:var(--pr);color:var(--pr);font-weight:600}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd)}.ck:first-of-type{border-top:0}.ck input{margin-top:5px;width:18px;height:18px;flex:none}.ck b{display:block}.ck span{color:var(--mu);font-size:13px}
.btn{border:0;background:var(--pr);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600}.btn.g{background:#fff;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#fff;color:var(--rd);border:1px solid #f3c1bc}.btn.s{padding:7px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.live{border:2px solid var(--gr);background:#f1fbf7}.lk{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px;word-break:break-all}.lk code{flex:1;font-size:14px}
.off{border-color:var(--rd);background:#fff5f4}
.frame{border:1px solid var(--bd);border-radius:14px;background:#fff;margin-top:12px;overflow:hidden}.fh{background:#f8f9fc;border-bottom:1px solid var(--bd);padding:8px 14px;font-size:13px;color:var(--mu)}
.cl{padding:22px 20px;max-width:680px;margin:0 auto}.cl h2{font-size:22px;margin:0}.cl h3{font-size:13px;margin:22px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.sm2{font-size:16px;margin:14px 0}
.pb{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--gr);transition:width .3s}
.it{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.it:first-of-type{border-top:0}.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--gr);margin-top:2px}.dot.p{background:var(--pr)}.dot.n{background:#f2b33d;color:#12162a}
.it small{display:block;color:var(--mu)}.ask{background:#fff7e0;border:1px solid #f3d38a;border-radius:10px;padding:10px 12px;margin-top:6px}
.ft{margin-top:22px;padding-top:12px;border-top:1px solid var(--bd);color:var(--mu);font-size:13px}
.dead{text-align:center;padding:50px 20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#12162a;color:#fff;border-radius:10px;padding:11px 16px;max-width:calc(100% - 24px);z-index:9}
[hidden]{display:none!important}

<div class="crumb">Zedu › Learner app › <b>Share progress</b></div>
<h1>Share progress</h1>
<p class="mu" style="margin:0">Send a client or a boss a simple update link. They see only what you choose, they don’t need a Ziki account, and you can turn the link off at any time.</p>
<div class="tabs" role="group" aria-label="View"><button data-t="set" aria-pressed="true">Set up</button><button data-t="pre" aria-pressed="false">What your client sees</button></div>
<div id="set"></div><div id="pre" hidden></div>
</main>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D={shipped:[[322,'Invoices now show the correct total','Juno'],[315,'Search now finds names with accents','Juno'],[331,'Welcome email typo fixed','Sage']],prog:[[341,'Dark mode no longer flashes white on first load','Juno',60],[313,'Team invite page loads faster','Pip',30]],need:[[346,'Choose the wording for reminder emails: “today” or the date','Pip']]};
const cfg={to:'Mr. Bello (client)',per:'This week',inc:{shipped:1,prog:1,need:1,agents:0,nums:0},exp:7,sum:'',link:null};
let tab='set',tt;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800)}
function auto(){const i=cfg.inc,p=[];if(i.shipped)p.push(`${cfg.per==='This week'?'This week':'Over the last 30 days'} the team fixed ${D.shipped.length} problems learners reported`);
if(i.prog)p.push(`${i.shipped?'and started':'The team started'} ${D.prog.length} more`);let s=p.join(' ')+(p.length?'.':'');
if(i.need)s+=` One decision from you will unblock reminder emails.`;return(s||'Here is a short update on the project.').trim()}
const exd=()=>cfg.exp?new Date(Date.now()+cfg.exp*864e5).toLocaleDateString('en-GB',{day:'numeric',month:'long'}):null;
function setup(){const i=cfg.inc,L=cfg.link;
$('#set').innerHTML=`<section class="card"><h2>Who is this for?</h2><label class="l" for="to">Name</label><input type="text" id="to" value="${esc(cfg.to)}">
<label class="l">Period</label><div class="chips">${['This week','Last 30 days'].map(x=>`<button data-p="${x}" aria-pressed="${x===cfg.per}">${x}</button>`).join('')}</div></section>
<section class="card"><h2>What do they see?</h2>
${[['shipped','What shipped','Work that is finished and live.'],['prog','What’s in progress','Work the team is doing now, with a progress bar.'],['need','What we need from you','Decisions that are holding work back.'],['agents','Agent names','Off by default. Shows which agent did each item.'],['nums','Issue numbers','Off by default. Clients rarely need these.']].map(x=>`<label class="ck"><input type="checkbox" data-i="${x[0]}" ${i[x[0]]?'checked':''}><div><b>${x[1]}</b><span>${x[2]}</span></div></label>`).join('')}
<p class="mu sm" style="margin:8px 0 0">Never shared: comments, code, costs, or anything marked private.</p></section>
<section class="card"><h2>Summary</h2><textarea id="sm" rows="3" aria-label="Summary">${esc(cfg.sum||auto())}</textarea><div class="row"><button class="btn g s" id="au">Write it for me</button></div>
<label class="l">Link expires</label><div class="chips">${[[7,'In 7 days'],[30,'In 30 days'],[0,'Never']].map(x=>`<button data-e="${x[0]}" aria-pressed="${cfg.exp===x[0]}">${x[1]}</button>`).join('')}</div>
<div class="row"><button class="btn" id="cr">${L?'Update link':'Create link'}</button><button class="btn g" id="pv">See what they’ll see</button></div></section>
${L?`<section class="card ${L.off?'off':'live'}"><h2>${L.off?'Link turned off':'Link is live'}</h2><div class="lk"><code>${L.url}</code><button class="btn g s" id="cp" ${L.off?'disabled':''}>Copy</button></div>
<p class="mu sm" style="margin:8px 0 0">${L.off?'Nobody can open it any more.':cfg.exp?'Expires on '+exd()+'. ':'Never expires. '}Viewed ${L.views} time${L.views===1?'':'s'}${L.views?' · last viewed just now':''}. <span class="mu">(Prototype link)</span></p>
<div class="row">${L.off?'<button class="btn g s" id="on">Turn it back on</button>':'<button class="btn g s" id="as">Open as the client</button><button class="btn r s" id="of">Stop sharing</button>'}</div></section>`:''}`}
function client(){const i=cfg.inc,L=cfg.link,n=x=>i.nums?`#${x} `:'',a=x=>i.agents?` · ${x}`:'';
if(L&&L.off)return`<div class="frame"><div class="fh">What ${esc(cfg.to)} sees</div><div class="dead"><h2>This link has been turned off</h2><p class="mu">Ask AJ for a new one.</p></div></div>`;
const tot=D.shipped.length+D.prog.length,pct=Math.round(100*(14+(i.shipped?0:0))/20);
return`<div class="frame"><div class="fh">What ${esc(cfg.to)} sees · no sign-in needed</div><div class="cl"><h2>Learner app · Progress update</h2><div class="mu sm">${cfg.per==='This week'?'Week of 2 November':'Last 30 days'} · prepared by AJ for ${esc(cfg.to)}</div>
<p class="sm2">${esc(cfg.sum||auto())}</p>
<div><b>14 of 20 planned items are done</b><div class="pb"><i style="width:${pct}%"></i></div></div>
${i.shipped?`<h3>What shipped</h3>${D.shipped.map(x=>`<div class="it"><span class="dot">✓</span><div>${n(x[0])}${esc(x[1])}<small>Live now${a(x[2])}</small></div></div>`).join('')}`:''}
${i.prog?`<h3>What’s in progress</h3>${D.prog.map(x=>`<div class="it"><span class="dot p">…</span><div style="flex:1">${n(x[0])}${esc(x[1])}<small>${x[3]}% done${a(x[2])}</small><div class="pb" style="height:6px"><i style="width:${x[3]}%"></i></div></div></div>`).join('')}`:''}
${i.need?`<h3>What we need from you</h3>${D.need.map(x=>`<div class="ask"><b>${n(x[0])}${esc(x[1])}</b><small style="display:block;color:var(--mu)">This is holding up reminder emails${a(x[2])}</small><div class="row"><button class="btn s" data-rp>Reply to AJ</button></div></div>`).join('')}`:''}
<div class="ft">Read-only update. ${cfg.exp?'This link expires on '+exd()+'.':'This link has no expiry.'} Questions? Reply to AJ.</div></div></div>`}
function render(){setup();$('#pre').innerHTML=client();$('#set').hidden=tab!=='set';$('#pre').hidden=tab!=='pre';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab))}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);
if(g('[data-t]')){tab=g('[data-t]').dataset.t;render()}
if(g('[data-p]')){cfg.per=g('[data-p]').dataset.p;cfg.sum='';render()}
if(g('[data-e]')){cfg.exp=+g('[data-e]').dataset.e;render()}
if(g('#au')){cfg.sum='';render();toast('Summary rewritten from what you chose to share.')}
if(g('#pv')){tab='pre';render();scrollTo(0,0)}
if(g('#cr')){cfg.sum=$('#sm').value;cfg.to=$('#to').value||cfg.to;if(!cfg.link)cfg.link={url:'ziki.dev/share/learner-app-9f3k',views:0,off:0};render();toast(cfg.link.views||cfg.link.off?'Link updated.':'Link created. Copy it and send it.')}
if(g('#cp')){navigator.clipboard&&navigator.clipboard.writeText(cfg.link.url).catch(()=>{});toast('Link copied.')}
if(g('#as')){cfg.link.views++;tab='pre';render();scrollTo(0,0)}
if(g('#of')){cfg.link.off=1;render();toast('Sharing stopped. The link no longer works.')}
if(g('#on')){cfg.link.off=0;render();toast('Link is live again.')}
if(g('[data-rp]'))toast('Your reply goes to AJ. (Demo)')});
document.addEventListener('change',e=>{const k=e.target.dataset.i;if(k){cfg.inc[k]=e.target.checked?1:0;cfg.sum='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='sm'){cfg.sum=e.target.value;$('#pre').innerHTML=client()}if(e.target.id==='to'){cfg.to=e.target.value;$('#pre').innerHTML=client()}});
render();
</script></body></html>
